plugins { id 'com.android.application' }

def keystoreFile = file(System.getenv("ANDROID_KEYSTORE_PATH") ?: "release-keystore.jks")
def hasReleaseSigning = System.getenv("ANDROID_KEYSTORE_PASSWORD") && System.getenv("ANDROID_KEY_ALIAS") && System.getenv("ANDROID_KEY_PASSWORD") && keystoreFile.exists()

android {
    namespace 'com.gpldroid.ptpdf'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gpldroid.ptpdf'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile keystoreFile
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                throw new GradleException("Release signing is not configured. Add the Android signing secrets to GitHub Actions.")
            }
        }
    }
}

tasks.register('syncWebAssets', Sync) {
    from('../../web')
    into('src/main/assets/web')
}

tasks.named('preBuild').configure {
    dependsOn(tasks.named('syncWebAssets'))
}
